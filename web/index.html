<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<!-- RemoteFM1 on Move, phase 1: the firmware's screen and LEDs live, its panel back. No external resources: the Move
     may have no internet. Phase 2 replaces this with RemoteFM1's own web/site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemoteFM1 on Move</title>
<style>
  :root { --bg: #141416; --panel: #1f1f23; --edge: #34343a; --text: #e9e6df; --dim: #8d8a84; --led: #ffb347;
          --key: #ece8de; --keyb: #2a2a2f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  #fw { color: var(--dim); }
  #status { color: var(--dim); font-size: 12px; min-height: 1.4em; }
  .dev { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .top { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  canvas { width: 360px; height: 360px; max-width: 100%; image-rendering: pixelated; background: #000;
           border-radius: 6px; border: 1px solid var(--edge); aspect-ratio: 1; }
  .side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 12px; }
  .knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .knob { background: var(--keyb); border-radius: 10px; padding: 6px; text-align: center; user-select: none;
          touch-action: none; cursor: ns-resize; }
  .knob b { display: block; font-size: 11px; color: var(--dim); font-weight: 600; }
  .knob span { display: inline-block; width: 30px; height: 30px; border-radius: 50%; margin: 4px 0;
               background: radial-gradient(circle at 50% 35%, #55555c, #2b2b30); border: 1px solid #45454c; }
  .knob button { width: 28px; }
  .btns { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
  button { background: var(--keyb); color: var(--text); border: 1px solid var(--edge); border-radius: 8px;
           padding: 8px 2px; font: 600 11px system-ui, sans-serif; cursor: pointer; touch-action: none; }
  .btn { position: relative; }
  .btn i { position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%;
           background: var(--led); opacity: 0; }
  .keys { position: relative; height: 120px; margin-top: 16px; user-select: none; touch-action: none; }
  .k { position: absolute; top: 0; border: 1px solid #00000066; border-radius: 0 0 6px 6px; }
  .k.w { background: var(--key); height: 120px; z-index: 1; }
  .k.b { background: #111; height: 74px; z-index: 2; }
  .k i { position: absolute; bottom: 8px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
         background: var(--led); opacity: 0; }
  .k.down.w { background: #cfc9bb; } .k.down.b { background: #333; }
  .master { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .master input { flex: 1; }
  @media (max-width: 520px) { canvas { width: 100%; height: auto; } .btns { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<main>
  <header><h1>RemoteFM1 on Move <span id="fw"></span></h1><div id="status">connecting…</div></header>
  <section class="dev">
    <div class="top">
      <canvas id="lcd" width="240" height="240"></canvas>
      <div class="side">
        <div class="knobs" id="knobs"></div>
        <label class="master">MASTER <input id="master" type="range" min="0" max="1023" value="768"></label>
      </div>
    </div>
    <div class="btns" id="btns"></div>
    <div class="keys" id="keys"></div>
  </section>
</main>
<script>
"use strict";
const OP = { KEY: 1, BTN: 3, ENC: 4, MASTER: 5 };
const ROLES = ["SELECT", "ALGO", "PRESETS", "K1", "K2", "K3", "K4"];
const lcd = document.getElementById("lcd"), ctx = lcd.getContext("2d"), img = ctx.createImageData(240, 240);
let ws = null, info = null, leds = new Uint8Array(45), ledOf = {};
for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;

function send(op, a, b) {
  if (!ws || ws.readyState !== 1) return;
  const m = new Uint8Array([op, a & 255, b & 255, (b >> 8) & 255]);
  ws.send(m);
}
function level(id) { const at = ledOf[id]; return at === undefined ? 0 : leds[at]; }

function build() {
  // the panel's LED for each keymap id (0..13 matrix buttons, 14.. keys): rows 1..4 are LED lines 0..3
  ledOf = {};
  if (info && info.keymap) for (let r = 1; r <= 4; r++) for (let c = 0; c < 11; c++) {
    const id = info.keymap[r * 11 + c];
    if (id >= 0) ledOf[id] = c * 4 + (r - 1);
  }
  const fw = info && info.slots && info.slots[info.active];
  document.getElementById("fw").textContent = fw ? `— ${fw.name} ${fw.version}` : "— no firmware";
  const kn = document.getElementById("knobs"); kn.innerHTML = "";
  ROLES.forEach((name, r) => {
    const e = info && info.enc ? info.enc[r] : [r, 1];
    const d = document.createElement("div"); d.className = "knob";
    d.innerHTML = `<b>${name}</b><button>−</button><span></span><button>+</button>`;
    const turn = n => send(OP.ENC, e[0], n * (e[1] < 0 ? -1 : 1));
    d.querySelectorAll("button")[0].onclick = () => turn(-1);
    d.querySelectorAll("button")[1].onclick = () => turn(1);
    d.addEventListener("wheel", ev => { ev.preventDefault(); turn(ev.deltaY < 0 ? 1 : -1); }, { passive: false });
    let y0 = null;
    const sp = d.querySelector("span");
    sp.addEventListener("pointerdown", ev => { y0 = ev.clientY; sp.setPointerCapture(ev.pointerId); });
    sp.addEventListener("pointermove", ev => { if (y0 === null) return; const dy = y0 - ev.clientY;
      if (Math.abs(dy) >= 8) { turn(dy > 0 ? 1 : -1); y0 = ev.clientY; } });
    sp.addEventListener("pointerup", () => { y0 = null; });
    kn.appendChild(d);
  });
  const bt = document.getElementById("btns"); bt.innerHTML = "";
  (info && info.buttons ? info.buttons : []).forEach(([name, id]) => {
    const b = document.createElement("button"); b.className = "btn"; b.dataset.id = id;
    b.innerHTML = `${name || "?"}<i></i>`;
    b.onpointerdown = ev => { b.setPointerCapture(ev.pointerId); send(OP.BTN, id, 1); };
    b.onpointerup = b.onpointercancel = () => send(OP.BTN, id, 0);
    bt.appendChild(b);
  });
  const ks = document.getElementById("keys"); ks.innerHTML = "";
  const BLACK = [1, 3, 5, 8, 10]; // semitones above F that are black: F# G# A# C# D#
  const whites = []; for (let k = 0; k < 27; k++) if (!BLACK.includes(k % 12)) whites.push(k);
  const W = 100 / whites.length;
  for (let k = 0; k < 27; k++) {
    const d = document.createElement("div"), black = BLACK.includes(k % 12);
    d.className = "k " + (black ? "b" : "w"); d.dataset.key = k; d.innerHTML = "<i></i>";
    if (black) { const left = whites.filter(w => w < k).length; d.style.left = `calc(${left * W}% - ${W * 0.3}%)`; d.style.width = `${W * 0.6}%`; }
    else { d.style.left = `${whites.indexOf(k) * W}%`; d.style.width = `${W}%`; }
    d.onpointerdown = ev => { d.setPointerCapture(ev.pointerId); d.classList.add("down"); send(OP.KEY, k, 100); };
    d.onpointerup = d.onpointercancel = () => { d.classList.remove("down"); send(OP.KEY, k, 0); };
    ks.appendChild(d);
  }
  paintLeds();
}
function paintLeds() {
  document.querySelectorAll(".btn").forEach(b => { b.querySelector("i").style.opacity = level(+b.dataset.id) / 255; });
  document.querySelectorAll(".k").forEach(k => { k.querySelector("i").style.opacity = level(14 + +k.dataset.key) / 255; });
}
function rows(y0, n, d) {
  for (let y = 0; y < n; y++) for (let x = 0; x < 240; x++) {
    const o = (y * 240 + x) * 2, v = d[o] << 8 | d[o + 1], p = ((y0 + y) * 240 + x) * 4;
    img.data[p] = (v >> 11) * 255 / 31; img.data[p + 1] = ((v >> 5) & 63) * 255 / 63; img.data[p + 2] = (v & 31) * 255 / 31;
  }
  ctx.putImageData(img, 0, 0);
}
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = ev => {
    if (typeof ev.data === "string") { info = JSON.parse(ev.data); build(); return; }
    const d = new Uint8Array(ev.data);
    if (d[0] === 1) rows(d[1], d[2], d.subarray(3));
    else if (d[0] === 2) { leds = d.slice(1, 46); paintLeds(); }
  };
  ws.onclose = () => { document.getElementById("status").textContent = "disconnected: retrying…"; setTimeout(connect, 1000); };
}
document.getElementById("master").oninput = ev => send(OP.MASTER, 0, +ev.target.value);
async function status() {
  try {
    const s = await (await fetch("/api/status")).json();
    const cpu = (s.slots || []).filter(x => x).map(x => `${x.id} ${x.cpu}%`).join(", ");
    document.getElementById("status").textContent = `${cpu || "no firmware"} · late blocks ${s.late}`;
  } catch (e) { }
}
setInterval(status, 2000); status();
connect();
</script>
</body>
</html>
